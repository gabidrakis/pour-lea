<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour Lea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neonderthaw&family=Playfair+Display:ital,wght@1,700&display=swap">
<style>
  /* Un seul écran noir : le bouton néon au centre, puis le cœur de « love you » en canvas plein écran */
  :root {
    --bg: #000;
    --neon: #7cc4ff;
    --neon-deep: #2f7dff;
    --core: #eef7ff;
    --display: "Neonderthaw", "Snell Roundhand", cursive;
    color-scheme: dark;
  }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body { margin: 0; padding-inline: 16px; touch-action: manipulation; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #go {
    position: fixed; inset: 0; margin: auto;
    width: max-content; height: max-content;
    padding: .2em .9em .3em;
    background: transparent;
    border: 2px solid var(--neon);
    border-radius: 999px;
    color: var(--core);
    font: 400 clamp(48px, 15vw, 76px)/1 var(--display);
    text-shadow: 0 0 4px var(--core), 0 0 12px var(--neon), 0 0 28px var(--neon-deep), 0 0 52px var(--neon-deep);
    box-shadow: 0 0 6px var(--neon), 0 0 22px var(--neon-deep), inset 0 0 14px var(--neon-deep);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    animation: flicker 5s infinite, breathe 2.6s ease-in-out infinite;
    transition: opacity .7s ease, transform .7s ease;
  }
  #go:focus-visible { outline: 2px dashed var(--neon); outline-offset: 8px; }
  #go.gone { animation: none; opacity: 0; transform: scale(1.15); pointer-events: none; }

  /* tube néon qui grésille brièvement de temps en temps */
  @keyframes flicker {
    0%, 18%, 22%, 24%, 61%, 63%, 100% { opacity: 1; }
    19%, 23% { opacity: .35; }
    62% { opacity: .6; }
  }
  @keyframes breathe {
    50% { filter: brightness(1.25) drop-shadow(0 0 10px var(--neon-deep)); }
  }
  @media (prefers-reduced-motion: reduce) { #go { animation: none; } }
</style>

<canvas id="c" aria-hidden="true"></canvas>
<button id="go" type="button">clique &lt;3</button>
<audio id="music" src="musique.mp3" loop preload="auto"></audio>

<script>
  const WORDS = ["I love you", "i love you", "I LOVE YOU", "love you", "Love You"];
  const COLORS = ["#4696ff", "#6eb9ff", "#326ee6", "#96d2ff"];
  const FINAL_TEXT = "I love you Lea";
  const OUTLINE_COUNT = 220, FILL_COUNT = 430;
  const OUTLINE_MS = 4000;   // phase 1 : le contour se dessine
  const FILL_MS = 5000;      // phase 2 : le cœur se remplit de bas en haut
  const FINAL_AT = OUTLINE_MS + FILL_MS + 500;

  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  const go = document.getElementById("go");
  const music = document.getElementById("music");
  let W, H, dpr, parts = [], final, t0 = null;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
  }
  addEventListener("resize", resize);
  resize();

  // courbe du cœur en unités « cœur » (x de -16 à 16, y de -17 à 12)
  function heart(t, r = 1) {
    const x = 16 * Math.sin(t) ** 3;
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return [r * x, r * y + 2.5];
  }
  const scale = () => Math.min(W / 44, H / 40);   // marge pour que les mots du contour ne sortent pas de l'écran

  // chaque mot est dessiné une seule fois avec son halo, puis recopié à chaque image
  function sprite(text, font, size, color, core) {
    const c = document.createElement("canvas"), g = c.getContext("2d");
    g.font = font;
    const w = Math.ceil(g.measureText(text).width), pad = Math.ceil(size * 0.9);
    const cw = w + 2 * pad, ch = Math.ceil(size * 1.3) + 2 * pad;
    c.width = cw * dpr; c.height = ch * dpr;
    g.scale(dpr, dpr);
    g.font = font; g.textAlign = "center"; g.textBaseline = "middle";
    g.shadowColor = color; g.shadowBlur = size * 0.7; g.fillStyle = color;
    g.fillText(text, cw / 2, ch / 2);
    g.shadowBlur = size * 0.2; g.fillStyle = core;
    g.fillText(text, cw / 2, ch / 2);
    return { c, w: cw, h: ch };
  }

  function word(hx, hy, delay, size) {
    const font = `${Math.random() < 0.3 ? "700" : "400"} ${size}px Arial, Helvetica, sans-serif`;
    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
    const s = sprite(WORDS[Math.floor(Math.random() * WORDS.length)], font, size, color, "rgba(225,240,255,.9)");
    return { ...s, hx, hy, delay, phase: Math.random() * Math.PI * 2 };
  }

  function build() {
    const s = scale();
    for (let i = 0; i < OUTLINE_COUNT; i++) {
      const [x, y] = heart(Math.PI * 2 * i / OUTLINE_COUNT);
      const j = () => (Math.random() - 0.5) * 0.6;
      parts.push(word(x + j(), y + j(), OUTLINE_MS * i / OUTLINE_COUNT, Math.round(s * (0.95 + Math.random() * 0.4))));
    }
    for (let i = 0; i < FILL_COUNT; i++) {
      const [x, y] = heart(Math.random() * Math.PI * 2, Math.sqrt(Math.random()) * 0.92);
      const height = (y + 14.5) / 29;   // 0 en bas du cœur, 1 en haut
      parts.push(word(x, y, OUTLINE_MS + FILL_MS * height + (Math.random() - 0.5) * 300,
                      Math.round(s * (0.75 + Math.random() * 0.35))));
    }
    const ff = '700 italic 100px "Playfair Display", Georgia, serif';
    ctx.font = ff;
    const size = Math.min(100, 100 * W * 0.84 / ctx.measureText(FINAL_TEXT).width);
    final = sprite(FINAL_TEXT, ff.replace("100px", size + "px"), size, "#9cc8ff", "#f4f8ff");
  }

  function draw(now) {
    if (t0 === null) t0 = now;
    const el = now - t0, s = scale(), cx = W / 2, cy = H / 2;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    for (const p of parts) {
      const a = Math.min(1, Math.max(0, (el - p.delay) / 400));
      if (a <= 0) continue;
      const flick = a >= 1 ? 0.75 + 0.25 * Math.sin(el * 0.0024 + p.phase) : 1;
      ctx.globalAlpha = a * flick;
      ctx.drawImage(p.c, cx + p.hx * s - p.w / 2, cy - p.hy * s - p.h / 2, p.w, p.h);
    }

    const fa = Math.min(1, Math.max(0, (el - FINAL_AT) / 1200));
    if (fa > 0) {
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, final.w * 0.55);
      g.addColorStop(0, "rgba(0,0,0,.8)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalAlpha = fa;
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(1, 0.35); ctx.translate(-cx, -cy);
      ctx.fillStyle = g;
      ctx.fillRect(cx - final.w, cy - final.w, final.w * 2, final.w * 2);
      ctx.restore();
      ctx.globalAlpha = fa * (0.9 + 0.1 * Math.sin(el * 0.003));
      ctx.drawImage(final.c, cx - final.w / 2, cy - final.h / 2, final.w, final.h);
    }
    requestAnimationFrame(draw);
  }

  go.addEventListener("click", async () => {
    music.play().catch(() => {});   // doit partir dans le clic, sinon Safari bloque le son
    go.classList.add("gone");
    setTimeout(() => { go.hidden = true; }, 700);
    navigator.wakeLock?.request("screen").catch(() => {});
    try { await document.fonts.load('700 italic 40px "Playfair Display"'); } catch {}
    build();
    requestAnimationFrame(draw);
  }, { once: true });
</script>
